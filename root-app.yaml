apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/michi-1221/workshop-gitops-sample.git
    targetRevision: main
    path: apps          # 子の Application の YAML だけを置くディレクトリ
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd   # 子の Application は argocd ネームスペースに作られる
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
